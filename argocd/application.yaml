apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sravani205/Kubernetes-Delivery-Platform.git
    targetRevision: main
    path: helm/delivery-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery-app
  template:
    metadata:
      labels:
        app: delivery-app
    spec:
      containers:
        - name: delivery-app
          image: delivery-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-app
spec:
  selector:
    app: delivery-app
  ports:
    - port: 80
      targetPort: 8080
